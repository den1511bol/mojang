name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'factory/**'
      - '.github/workflows/factory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Mahjong-Infinity.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mahjong-infinity-apk
          path: Mahjong-Infinity.apk

      - name: Publish release (public download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest Mahjong-Infinity.apk \
            --title "Маджонг ∞ (последняя сборка)" \
            --notes "Разработчик: @yfeeeee. Скачайте Mahjong-Infinity.apk и установите." \
            --target "${{ github.sha }}"
